{% extends "base.html" %}

{% block content %}
  <section>
    <h2>Users</h2>

    

    {% if users %}
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Email</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for user in users %}
            <tr>
              <td>{{ user.id }}</td>
              <td>{{ user.Username }}</td>
              <td>{{ user.email }}</td>
              <td>
                <a href="/users/{{ user.id }}/edit">Edit</a>
                <form method="post" action="/users/{{ user.id }}/delete" style="display:inline">
                  <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}" />
                  <button type="submit">Delete</button>
                </form>
              </td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    {% else %}
      
      <p>No users yet.</p>    
    {% endif %}
  </section>
{% endblock %}
