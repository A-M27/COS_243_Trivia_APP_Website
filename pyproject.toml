[project]
name = "flashcard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "root", email = "root@picoctf" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic[email]>=2.13.5",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.42",
    "uvicorn>=0.52.4",
    "websockets>=17.4",
]

[project.scripts]
flashcard = "flashcard:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
